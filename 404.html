
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      const segmentCount = 1;
      const location = window.location;
      const pathSegments = location.pathname.split('/');

      const repo = pathSegments[1];
      const route = pathSegments.slice(segmentCount + 1).join('/');

      location.replace(
        location.origin +
        '/' + repo + '/?/' +
        route +
        location.search.replace(/&/g, '~and~') +
        location.hash
      );
    </script>
  </head>
  <body></body>
</html>
